# Variables
@accentColor = #249BF7
@background  = #FFFFFF
@foreground  = #252638

# Fuente (requiere FlatInterFont.install())
defaultFont = 13 "Inter"

# Color Componentes
Sidebar.background = #F9FAFC
Sidebar.tileBackground = #F5F5F5
Sidebar.selectedBorderColor = #767676

Text.secondaryForeground = #5E5E5E
Text.tertiaryForeground = #767676

TextField.background = #F5F5F5
TextField.placeholderForeground = #767676
Component.borderColor = #F5F5F5

ProgressBar.foreground = #52C896
ProgressBar.background = #E6E6E6

# EJEMPLO: boton.putClientProperty("FlatLaf.styleClass", "primary");
[style]Button.primary = margin: 8,16,8,16; background: @accentColor; foreground: #FFFFFF; focusedBackground: @accentColor; hoverBackground: #1B87DC; borderWidth: 0
[style]Button.secondary = margin: 8,16,8,16; background: #FFFFFF; foreground: @foreground; borderColor: #D9D9D9; hoverBackground: #F5F5F5
[style]Button.success = margin: 8,16,8,16; background: #43A047; foreground: #FFFFFF; focusedBackground: #43A047; hoverBackground: #388E3C; borderWidth: 0
[style]Button.danger = margin: 8,16,8,16; background: #D32F2F; foreground: #FFFFFF; focusedBackground: #D32F2F; hoverBackground: #B71C1C; borderWidth: 0
[style]Button.link = margin: 2,4,2,4; background: #FFFFFF; foreground: @accentColor; borderWidth: 0; focusWidth: 0; hoverBackground: #F5F5F5
[style]Button.close = margin: 2,8,2,8; background: $Alertas.background; borderWidth: 0; focusWidth: 0; hoverBackground: #E2E5EA
[style]Button.pillClose = margin: 2,6,2,6; background: $Note.background; borderWidth: 0; focusWidth: 0
[style]ToggleButton.tab = background: #FFFFFF; borderWidth: 0; focusWidth: 0; margin: 4,6,8,6; selectedBackground: #FFFFFF; selectedForeground: @accentColor; hoverBackground: #F5F5F5


[style]ToggleButton.sidebarTile = arc: 5; \
    font: size: 12; \
    margin: 6,2,6,2; \
    borderWidth: 1; \
    focusWidth: 0; \
    innerFocusWidth: 0; \
    background: $Sidebar.background; \
    borderColor: $Sidebar.background; \
    hoverBackground: $Sidebar.tileBackground; \
    pressedBackground: $Sidebar.tileBackground; \
    selectedBackground: $Sidebar.tileBackground; \
    selectedForeground: @foreground; \
    focusedBorderColor: $Sidebar.background; \
    selectedBorderColor: $Sidebar.selectedBorderColor; \
    focusedSelectedBorderColor: $Sidebar.selectedBorderColor; \
    hoverSelectedBorderColor: $Sidebar.selectedBorderColor

View.padding = 24,50,24,36
Sidebar.padding = 45,28,16,28
Sidebar.tileGap = 20
Sidebar.tileSize = 86,80

PageHeader.bottomGap = 24


# Status
Status.delivered.background = #E5F6F0
Status.delivered.foreground = #3B725F
Status.pending.background = #F8F6EA
Status.pending.foreground = #B88B4A
Status.inProgress.background = #EAECEF
Status.inProgress.foreground = #5E5E5E
Status.error.background = #FDD3D0
Status.error.foreground = #900B09

# Colores de las categorias del Plan Academico segun su posicion. Los lee Ui.categoryColor()
Category.color1 = #00A6F4
Category.color2 = #E6A817
Category.color3 = #38B06E
Category.color4 = #CE5FD3
Category.color5 = #64748B

# Paneles y notas
Panel.borderColor = #E5E7EB
Panel.subtleBackground = #F9FAFC
Note.background = #F5E9B8
Alertas.background = #F2F3F5
Alertas.cardBackground = #FFFFFF
Filtros.background = #F4F5F7

# Tablas
Table.showHorizontalLines = true
Table.showVerticalLines = false
Table.gridColor = #EEEEEE
Table.rowHeight = 42
TableHeader.background = #FFFFFF
TableHeader.foreground = #5E5E5E
TableHeader.bottomSeparatorColor = #E5E7EB

# Valores por componente
Button.arc    = 5
Component.arc = 5
TextComponent.arc = 5
ProgressBar.arc = 10
Status.arc = 10
Sidebar.width = 248
Alertas.width = 290
