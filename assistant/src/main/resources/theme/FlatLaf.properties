# Variables
@accentColor = #249BF7
@background  = #FFFFFF
@foreground  = #252638

# Fuente (requiere FlatInterFont.install())
defaultFont = 13 "Inter"

# Color Componentes
Sidebar.background = #F9FAFC
Sidebar.tileBackground = #F5F5F5
Sidebar.selectedBorderColor = #767676

Text.secondaryForeground = #5E5E5E
Text.tertiaryForeground = #767676

TextField.background = #F5F5F5
TextField.placeholderForeground = #767676
Component.borderColor = #F5F5F5

ProgressBar.foreground = #52C896
ProgressBar.background = #E6E6E6

# Uso en Java: boton.putClientProperty("FlatLaf.styleClass", "primary");
[style]Button.primary = margin: 8,16,8,16; background: @accentColor; foreground: #FFFFFF; focusedBackground: @accentColor; borderWidth: 0


[style]ToggleButton.sidebarTile = arc: 5; \
    margin: 6,4,6,4; \
    borderWidth: 1; \
    focusWidth: 0; \
    innerFocusWidth: 0; \
    background: $Sidebar.background; \
    borderColor: $Sidebar.background; \
    hoverBackground: $Sidebar.tileBackground; \
    pressedBackground: $Sidebar.tileBackground; \
    selectedBackground: $Sidebar.tileBackground; \
    selectedForeground: @foreground; \
    focusedBorderColor: $Sidebar.background; \
    selectedBorderColor: $Sidebar.selectedBorderColor; \
    focusedSelectedBorderColor: $Sidebar.selectedBorderColor; \
    hoverSelectedBorderColor: $Sidebar.selectedBorderColor

View.padding = 24,50,24,36
Sidebar.padding = 45,28,16,28
Sidebar.tileGap = 20
Sidebar.tileSize = 86,80

PageHeader.bottomGap = 24


# Status
Status.delivered.background = #E5F6F0
Status.delivered.foreground = #3B725F
Status.pending.background = #F8F6EA
Status.pending.foreground = #B88B4A
Status.error.background = #FDD3D0
Status.error.foreground = #900B09

# Valores por componente
Button.arc    = 5
Component.arc = 5
TextComponent.arc = 5
ProgressBar.arc = 10
Status.arc = 10
Sidebar.width = 248
